name: Email04 Linux certification
on:
  push:
    branches: [validation/rlx-email04-linux]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: email04-certification-${{ github.ref }}
  cancel-in-progress: false
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Environment
        run: |
          node --version
          npm --version
          free -m
          docker version
          echo "EMAIL_INTAKE_QA_CHROME=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - run: git diff --check HEAD^
      - run: npx tsc --noEmit
      - run: npm test -- --run --pool=threads --maxWorkers=1 --no-file-parallelism
      - run: npm run lint
      - run: npx next build --webpack
      - name: Disposable database, Auth, browser review and physical Storage
        run: node scripts/email-intake/clean-room.mjs --storage-api --automation
      - name: Sanitized certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: email04-certification
          path: rehearsal/reports/RLX_EMAIL_03_CLEAN_ROOM*.json
          if-no-files-found: ignore
          retention-days: 7
