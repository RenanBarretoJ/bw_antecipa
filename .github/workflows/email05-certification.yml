name: Email05 Linux certification
on:
  push:
    branches: [feature/rlx-email05-operations]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: email05-certification-${{ github.ref }}
  cancel-in-progress: false
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Browser executable
        run: echo "EMAIL_INTAKE_QA_CHROME=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - run: git diff --check HEAD^
      - run: npx tsc --noEmit
      - run: npm test -- --run --pool=threads --maxWorkers=1 --no-file-parallelism
      - run: npm run lint
      - run: npx next build --webpack
      - name: Disposable schema, Auth, RLS, MFA, UI and fiscal regression
        run: node scripts/email-intake/clean-room.mjs --storage-api --automation --operators
      - name: Sanitized certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: email05-certification
          path: |
            rehearsal/reports/RLX_EMAIL_03_CLEAN_ROOM*.json
            rehearsal/tmp/bw_email03_*/email05-ui.json
            rehearsal/tmp/bw_email03_*/email-browser-build.log
            rehearsal/tmp/bw_email03_*/email05-screenshots/*.png
          if-no-files-found: ignore
          retention-days: 7
