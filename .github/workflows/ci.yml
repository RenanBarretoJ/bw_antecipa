name: CI

on:
  pull_request:
  push:
    branches:
      - homolog
      - main
      - master
      - feature/vortx-real-data-preview
      - integration/vortx-main-20261021

jobs:
  validate:
    name: Typecheck, lint, tests and build
    # The SERPRO PR has its own secret-free, contained native orchestration below.
    if: github.head_ref != 'feature/s1-serpro-nfe-gestor-20261026'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Main ancestry and production hotfix preservation
        if: github.head_ref == 'integration/vortx-main-20261021' || github.ref == 'refs/heads/integration/vortx-main-20261021'
        run: node scripts/qa/vortx/main-preservation.mjs

      - name: Vortx Preview boundary (synthetic only)
        if: contains(fromJSON('["feature/vortx-real-data-preview","integration/vortx-main-20261021"]'), github.head_ref || github.ref_name)
        run: node --test scripts/qa/vortx/preview-scope.test.mjs

      - name: Vortx callback SQL regression (two disposable local stacks)
        if: contains(fromJSON('["feature/vortx-real-data-preview","integration/vortx-main-20261021"]'), github.head_ref || github.ref_name)
        run: node scripts/qa/vortx/callback-sql-rehearsal.mjs
        env:
          LOCALAPPDATA: ${{ runner.temp }}

      # Native tables and callback leases must retain their real SQL/RLS proof on this Preview branch.
      - name: Vortx stock SQL regression (two disposable local stacks)
        if: contains(fromJSON('["feature/vortx-real-data-preview","integration/vortx-main-20261021"]'), github.head_ref || github.ref_name)
        run: node scripts/qa/vortx/native-stock-sql-rehearsal.mjs
        env:
          LOCALAPPDATA: ${{ runner.temp }}

      - name: Conditional reconciliation SQL regression (two disposable local stacks)
        if: github.head_ref == 'integration/vortx-main-20261021' || github.ref == 'refs/heads/integration/vortx-main-20261021'
        run: node scripts/qa/conciliacao/reconciliation-sql.mjs --local-only
        env:
          LOCALAPPDATA: ${{ runner.temp }}

      - name: Conditional reconciliation SQL evidence
        if: always() && (github.head_ref == 'integration/vortx-main-20261021' || github.ref == 'refs/heads/integration/vortx-main-20261021')
        uses: actions/upload-artifact@v4
        with:
          name: conditional-reconciliation-sql
          path: ${{ runner.temp }}/bw-antecipa-evidence/reconciliation-v2-*/REPORT.json
          if-no-files-found: error

      - name: EMAIL03 native QA provisioning and tests (isolated synthetic)
        if: ${{ !contains(fromJSON('["integration/vortx-main-20261021","main","homolog"]'), github.head_ref || github.ref_name) }}
        run: |
          node --test scripts/qa/vortx/main-native-images.test.mjs
          node scripts/qa/vortx/main-native-images.mjs --local-only
          node --test scripts/qa/vortx/main-native-fixture.test.mjs scripts/qa/vortx/main-native-snapshot.test.mjs
          node scripts/qa/vortx/main-native-qa.mjs --local-only --full-suite --snapshot

      - name: EMAIL03 native QA sanitized evidence
        if: always() && !contains(fromJSON('["integration/vortx-main-20261021","main","homolog"]'), github.head_ref || github.ref_name)
        uses: actions/upload-artifact@v4
        with:
          name: email03-native-qa
          path: |
            rehearsal/reports/bw-main-native-*/report.json
            rehearsal/reports/bw-main-native-*/vitest.json
            rehearsal/reports/bw-main-native-*/full-vitest.json
            rehearsal/reports/bw-main-native-*/contracts/*.json
          if-no-files-found: error

      - name: VRS duplicatas SQL regression (two disposable local stacks)
        if: github.head_ref == 'integration/vortx-main-20261021' || github.ref == 'refs/heads/integration/vortx-main-20261021'
        run: node scripts/qa/remessas/vrs-duplicatas-sql.mjs --local-only
        env:
          LOCALAPPDATA: ${{ runner.temp }}

      - name: Consultor read-only financial memory SQL regression
        if: github.head_ref == 'integration/vortx-main-20261021' || github.ref == 'refs/heads/integration/vortx-main-20261021'
        run: node scripts/qa/consultor/readonly-sql.mjs --local-only
        env:
          LOCALAPPDATA: ${{ runner.temp }}

      - name: Consultor read-only SQL evidence
        if: always() && (github.head_ref == 'integration/vortx-main-20261021' || github.ref == 'refs/heads/integration/vortx-main-20261021')
        uses: actions/upload-artifact@v4
        with:
          name: consultor-readonly-sql
          path: ${{ runner.temp }}/bw-consultor-readonly-sql-*/REPORT.json
          if-no-files-found: error

      - name: Complete tests with native Auth MFA Database Storage (isolated synthetic QA)
        if: contains(fromJSON('["integration/vortx-main-20261021","main","homolog"]'), github.head_ref || github.ref_name)
        run: |
          node --test scripts/qa/vortx/main-native-images.test.mjs
          node scripts/qa/vortx/main-native-images.mjs --local-only
          node --test scripts/qa/vortx/main-native-fixture.test.mjs scripts/qa/vortx/main-native-snapshot.test.mjs
          node scripts/qa/vortx/main-native-qa.mjs --local-only --full-suite --snapshot --release-upgrade --carteira

      - name: Native QA sanitized evidence
        if: always() && contains(fromJSON('["integration/vortx-main-20261021","main","homolog"]'), github.head_ref || github.ref_name)
        uses: actions/upload-artifact@v4
        with:
          name: vortx-main-native-qa
          path: |
            rehearsal/reports/bw-main-native-*/report.json
            rehearsal/reports/bw-main-native-*/vitest.json
            rehearsal/reports/bw-main-native-*/full-vitest.json
            rehearsal/reports/bw-main-native-*/carteira.json
            rehearsal/reports/bw-main-native-*/contracts/*.json
          if-no-files-found: error

      - name: PDF Turbopack packaging regression (synthetic Linux runtime)
        if: contains(fromJSON('["feature/vortx-real-data-preview","integration/vortx-main-20261021"]'), github.head_ref || github.ref_name)
        run: |
          node scripts/qa/pdf/turbopack-runtime.mjs --local-only --expect-missing-assets
          node scripts/qa/pdf/turbopack-runtime.mjs --local-only --expect-pass
        env:
          LOCALAPPDATA: ${{ runner.temp }}

      - name: PDF runtime evidence
        if: always() && (contains(fromJSON('["feature/vortx-real-data-preview","integration/vortx-main-20261021"]'), github.head_ref || github.ref_name))
        uses: actions/upload-artifact@v4
        with:
          name: pdf-turbopack-runtime
          path: |
            ${{ runner.temp }}/bw-pdf-turbopack-*/REPORT.json
            ${{ runner.temp }}/bw-pdf-turbopack-*/*.log
          if-no-files-found: ignore

      - name: Lint
        run: npm run lint

      - name: Build
        if: ${{ !contains(fromJSON('["feature/vortx-real-data-preview","integration/vortx-main-20261021"]'), github.head_ref || github.ref_name) }}
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://example.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'ci-placeholder-anon-key' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'ci-placeholder-service-role-key' }}
          PORTAL_FIDC_CREDENTIALS_JSON: ${{ secrets.PORTAL_FIDC_CREDENTIALS_JSON || '{}' }}

      # These exact certification/rollout branches must never receive real service credentials.
      - name: Reconciliation build (isolated placeholders)
        if: contains(fromJSON('["feature/vortx-real-data-preview","integration/vortx-main-20261021"]'), github.head_ref || github.ref_name)
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
          PORTAL_FIDC_CREDENTIALS_JSON: '{}'

  serpro_operational:
    name: SERPRO OFF - native QA, operational SQL and exact tree
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/s1-serpro-nfe-gestor-20261026'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:1
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-synthetic-anon
      SUPABASE_SERVICE_ROLE_KEY: ci-synthetic-service
      PORTAL_FIDC_CREDENTIALS_JSON: '{}'
      SERPRO_NFE_ENABLED: 'false'
      SERPRO_NFE_WORKER_ENABLED: 'false'
      SERPRO_NFE_QUERY_ENABLED: 'false'
      SERPRO_NFE_CONTRACT_VERIFIED: 'false'
      SERPRO_NFE_CONSUMPTION_MODE: OFF_ZERO_BUDGET
      SERPRO_NFE_CONSUMER_KEY: ''
      SERPRO_NFE_CONSUMER_SECRET: ''
    steps:
      - name: Checkout merge ref (no persisted credentials)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Prove executed SHA and tree (not a claim of head SHA CI)
        run: |
          mkdir -p "$RUNNER_TEMP/s22s"
          node scripts/qa/serpro/s2-2s-ci-provenance.mjs --ci-only > "$RUNNER_TEMP/s22s/provenance.json"

      - name: Install exact Linux dependencies
        run: npm ci

      - name: CI and selective manifest contracts
        run: |
          node --test scripts/qa/serpro/s2-2s-ci.test.mjs
          node --test scripts/qa/serpro/s2-2sr-linux-dependencies.test.mjs
          node --test scripts/qa/vortx/main-native-images.test.mjs scripts/qa/vortx/main-native-fixture.test.mjs scripts/qa/vortx/main-native-snapshot.test.mjs
          node scripts/qa/serpro/s2-2s-manifest.mjs --prepare-only > "$RUNNER_TEMP/s22s/selective-manifest.json"

      - name: Prepare pinned official images
        run: node scripts/qa/serpro/s2-2s-ci-assets.mjs --local-only > "$RUNNER_TEMP/s22s/images.json"

      - name: Contained S1, pilot isolation, S2.2 recovery, EMAIL03 and full suite
        run: node scripts/qa/serpro/s2-2r-contained-qa.mjs --native-full
        env:
          LOCALAPPDATA: ${{ runner.temp }}

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build with explicit webpack and synthetic configuration
        run: npm run build -- --webpack

      - name: Sanitized evidence (no environment or database dumps)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: serpro-off-native-operational-evidence
          path: |
            ${{ runner.temp }}/s22s/*.json
            ${{ runner.temp }}/bw-antecipa-evidence/s2-2r-local-20261028/bw-s22r-*/report.json
            ${{ runner.temp }}/bw-antecipa-evidence/s2-2r-local-20261028/bw-s22r-*/native-vitest.json
            ${{ runner.temp }}/bw-antecipa-evidence/s2-2r-local-20261028/bw-s22r-*/full-vitest.json
            ${{ runner.temp }}/bw-antecipa-evidence/s2-2r-local-20261028/bw-s22r-*/contracts/*.json
          if-no-files-found: error
          retention-days: 7
